[package]
name = "keyper"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "A small, in-memory Redis-compatible service built with Rust and Tokio"

[dependencies]
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "time"] }

[dev-dependencies]
tokio = { version = "=1.53.1", default-features = false, features = ["sync", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
